<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="local-token" content="{{ token }}"><title>DNS Investigator · 故障诊断</title><link rel="stylesheet" href="/assets/web.css"><script defer src="/assets/web.js"></script></head>
<body><header><a class="brand" href="/" aria-label="DNS Investigator 首页"><span class="mark">◈</span> DNS Investigator</a><nav aria-label="主导航"><button id="diagnosis" class="active">诊断</button><button id="history">历史记录</button></nav><button id="export" disabled>↓ 导出 JSON 报告</button></header>
<main><section class="hero"><p class="eyebrow">从问题到证据</p><h1>DNS 故障诊断</h1><p>用证据定位问题，给出下一步解决方案。</p><form id="form"><label class="sr" for="target">域名或网址</label><input id="target" required maxlength="2048" placeholder="域名或网址，如 example.com"><label class="sr" for="question">问题描述（可选）</label><input id="question" maxlength="4000" placeholder="描述你遇到的问题（可选）"><button class="primary" id="start">▶ 开始诊断</button></form><div class="import"><label for="file">导入历史 JSON 报告</label><input type="file" id="file" accept=".json,application/json"></div></section>
<p id="status" role="status" aria-live="polite"></p><section id="history-panel" hidden><h2>历史记录</h2><div id="history-list"></div></section>
<section id="empty" class="card empty"><span class="empty-mark">◎</span><h2>从一个域名开始调查</h2><p>输入目标启动调查，或导入已有报告查看诊断与证据。</p><p class="muted">调查由现有 Agent 执行；配置与密钥保留在本机。</p></section>
<section id="report" hidden><article class="card"><div class="card-top"><span id="label"></span><small id="source"></small></div><h2 id="title"></h2><p id="explanation"></p><div class="split"><section><h3>问题发生在哪里</h3><p id="location" class="location"></p><div id="other"></div></section><section><h3>建议如何处理 <small>尚未执行</small></h3><ol id="actions"></ol></section></div></article>
<div role="tablist" aria-label="报告详情" class="tabs"><button role="tab" id="tab-evidence" aria-controls="evidence" aria-selected="true">解析与证据</button><button role="tab" id="tab-details" aria-controls="details" aria-selected="false" tabindex="-1">排障详情</button><button role="tab" id="tab-timeline" aria-controls="timeline" aria-selected="false" tabindex="-1">调查时间线</button></div>
<section role="tabpanel" id="evidence" aria-labelledby="tab-evidence" class="card panel"></section><section role="tabpanel" id="details" aria-labelledby="tab-details" class="card panel" hidden></section><section role="tabpanel" id="timeline" aria-labelledby="tab-timeline" class="card panel" hidden></section><p class="footnote">本报告仅基于已测证据；修复操作尚未执行。历史报告不代表当前网络状态。</p></section></main></body></html>
