[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-investigator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
description = "Evidence-based DNS troubleshooting with an AI agent"
keywords = ["dns", "dnssec", "troubleshooting", "ai-agent", "network-diagnostics"]
requires-python = ">=3.11"
dynamic = ["dependencies", "version"]

[tool.setuptools.dynamic]
version = {attr = "dns_investigator.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dns_investigator = ["assets/*"]

[project.scripts]
dns-investigator = "dns_investigator.main:main"
dns-investigator-web = "dns_investigator.web:main"

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "matplotlib==3.11.2"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1.6,<4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/heyunz59/dns-investigator"
Repository = "https://github.com/heyunz59/dns-investigator"
Documentation = "https://github.com/heyunz59/dns-investigator/blob/main/README.md"
Issues = "https://github.com/heyunz59/dns-investigator/issues"
Changelog = "https://github.com/heyunz59/dns-investigator/blob/main/CHANGELOG.md"
